name: sibas
description: "SIBAS - Sistem Informasi Bank Sampah Poltekkes Kemenkes Yogyakarta"
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Supabase Backend
  supabase_flutter: ^2.5.6

  # QR Code Handling
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  image_picker: ^1.1.2

  # UI & Fonts
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # Web API untuk unduh CSV (Blob/anchor)
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/sibas-logo.png

