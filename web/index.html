<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SIBAS - Sistem Informasi Bank Sampah Poltekkes Kemenkes Yogyakarta">

  <!-- Mobile meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIBAS">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Theme color sesuai palet SIBAS (#005746) -->
  <meta name="theme-color" content="#005746">
  <meta name="msapplication-navbutton-color" content="#005746">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

  <title>SIBAS - Bank Sampah Poltekkes Kemenkes Yogyakarta</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F3F8F5;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #DFF3E8;
      border-top-color: #16865D;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: #005746;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">Memuat SIBAS...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
