<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SIBAS - Sistem Informasi Bank Sampah Poltekkes Kemenkes Yogyakarta">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Mobile meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIBAS">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Theme color sesuai palet SIBAS (#005746 light, #0A1411 dark) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#005746">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1411">
  <meta name="msapplication-navbutton-color" content="#005746">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

  <title>SIBAS - Bank Sampah Poltekkes Kemenkes Yogyakarta</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F3F8F5;
      margin: 0;
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #DFF3E8;
      border-top-color: #16865D;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: #005746;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0A1411;
      }

      .spinner {
        border-color: rgba(223, 243, 232, 0.16);
        border-top-color: #8FE6B8;
      }

      .loading-text {
        color: #DFF3E8;
      }
    }
  </style>
</head>

<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">Memuat SIBAS...</div>
  </div>

  <script>
    // Banner update Service Worker: hanya tampil bila sudah ada kontrol sebelumnya
    // (artinya ini update, bukan pemuatan pertama). Tidak pernah memblokir app.
    try {
      const sw = navigator.serviceWorker;
      if (sw) {
        const punyaKontrolAwal = !!sw.controller;
        let bannerTampil = false;
        sw.addEventListener('controllerchange', function () {
          if (!punyaKontrolAwal || bannerTampil) return;
          bannerTampil = true;
          const banner = document.createElement('div');
          banner.id = 'sibas-update-banner';
          banner.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;' +
            'background:#005746;color:#fff;padding:12px;display:flex;align-items:center;' +
            'justify-content:space-between;gap:12px;font-family:system-ui,sans-serif;font-size:14px;';
          const teks = document.createElement('span');
          teks.textContent = 'Versi baru SIBAS tersedia.';
          const tombol = document.createElement('button');
          tombol.textContent = 'Muat ulang';
          tombol.style.cssText = 'background:#fff;color:#005746;border:0;border-radius:8px;' +
            'padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;';
          tombol.addEventListener('click', function () {
            location.reload();
          });
          banner.appendChild(teks);
          banner.appendChild(tombol);
          document.body.appendChild(banner);
        });
      }
    } catch (e) {
      // diamkan: jangan ganggu pemuatan aplikasi
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
