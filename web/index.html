<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SIBAS - Sistem Informasi Bank Sampah Poltekkes Kemenkes Yogyakarta">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIBAS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme color matching SIBAS Design System (#0E7A4F) -->
  <meta name="theme-color" content="#0E7A4F">
  <meta name="msapplication-navbutton-color" content="#0E7A4F">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SIBAS - Bank Sampah Poltekkes Kemenkes Yogyakarta</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F3F8F5;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #DFF3E8;
      border-top-color: #0E7A4F;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #095C3B;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">Memuat SIBAS...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
