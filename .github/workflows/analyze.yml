name: Analyze & Test

# Fast feedback gate: no Flutter SDK on the dev machine, so this workflow is
# the only place `flutter analyze` and `flutter test` ever run.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "::notice::No test/ directory yet - skipping flutter test"
          fi
